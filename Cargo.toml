[package]
name = "zcast-interfaces"
version = "0.1.0"
edition = "2024"
description = "Versioned Rust interface contracts and Note primitive for the zcast Zettelkasten CMS"
license = "MIT"
repository = "https://github.com/zcast-cms/zcast-interfaces"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = "1"
